<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Administración | Gestión de Productos</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <div class="admin-layout">
        <aside class="admin-sidebar">
            <h2>FerreMaster Admin</h2>
            <ul>
                <li><a href="admin-home.html">📊 Dashboard</a></li>
                <li><a href="admin-productos.html" class="nav-active">📦 Productos</a></li>
                <li><a href="index.html" class="nav-logout">🚪 Cerrar Sesión</a></li>
            </ul>
        </aside>

        <main class="admin-content">
            <div class="admin-header-flex">
                <div>
                    <h1 class="page-title">Gestión de Productos</h1>
                    <p class="page-subtitle">Administra el catálogo de inventario disponible en la tienda.</p>
                </div>
                <a href="admin-producto-form.html" class="btn-accent">+ Agregar Producto</a>
            </div>

            <table class="admin-table">
                <thead>
                    <tr>
                        <th>Código</th>
                        <th>Producto</th>
                        <th>Categoría</th>
                        <th>Precio</th>
                        <th>Stock</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody id="tabla-admin-productos">
                </tbody>
            </table>
        </main>
    </div>

    <script src="js/app.js"></script>
</body>
</html>
