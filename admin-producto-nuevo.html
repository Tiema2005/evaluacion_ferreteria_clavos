<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Administración | Formulario de Producto</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <div class="admin-layout">
        <aside class="admin-sidebar">
            <h2>FerreMaster Admin</h2>
            <ul>
                <li><a href="admin-home.html">📊 Dashboard</a></li>
                <li><a href="admin-productos.html" class="nav-active">📦 Productos</a></li>
                <li><a href="index.html" class="nav-logout">🚪 Cerrar Sesión</a></li>
            </ul>
        </aside>

        <main class="admin-content">
            <h1 class="page-title" id="form-title">Agregar Nuevo Producto</h1>
            <p class="page-subtitle">Completa la información obligatoria para registrar o modificar un producto.</p>

            <div class="card card-form">
                <form id="form-admin-producto" novalidate>
                    <input type="hidden" id="prod-id">

                    <div class="form-grid">
                        <div class="form-group">
                            <label for="prod-codigo">Código / SKU *</label>
                            <input type="text" id="prod-codigo" class="form-control" placeholder="EJ: TAL-001">
                            <span class="error-message" id="error-prod-codigo">Obligatorio</span>
                        </div>

                        <div class="form-group">
                            <label for="prod-nombre">Nombre del Producto *</label>
                            <input type="text" id="prod-nombre" class="form-control" placeholder="Taladro Percutor 13mm">
                            <span class="error-message" id="error-prod-nombre">Obligatorio</span>
                        </div>

                        <div class="form-group">
                            <label for="prod-categoria">Categoría *</label>
                            <select id="prod-categoria" class="form-control">
                                <option value="">Seleccione una categoría</option>
                                <option value="Mat. Construcción">Mat. Construcción</option>
                                <option value="Pinturas">Pinturas</option>
                                <option value="Herramientas">Herramientas</option>
                                <option value="Gasfitería">Gasfitería</option>
                                <option value="Electricidad">Electricidad</option>
                                <option value="Tornillería">Tornillería</option>
                                <option value="Madera">Madera</option>
                            </select>
                            <span class="error-message" id="error-prod-categoria">Seleccione una opción</span>
                        </div>

                        <div class="form-group">
                            <label for="prod-precio">Precio ($) *</label>
                            <input type="number" id="prod-precio" class="form-control" placeholder="45990">
                            <span class="error-message" id="error-prod-precio">Ingrese un precio válido</span>
                        </div>

                        <div class="form-group">
                            <label for="prod-stock">Stock Actual *</label>
                            <input type="number" id="prod-stock" class="form-control" placeholder="10">
                            <span class="error-message" id="error-prod-stock">Ingrese la cantidad en stock</span>
                        </div>

                        <div class="form-group">
                            <label for="prod-stock-critico">Stock Crítico *</label>
                            <input type="number" id="prod-stock-critico" class="form-control" placeholder="3">
                            <span class="error-message" id="error-prod-stock-critico">Ingrese el umbral mínimo</span>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="prod-imagen">URL de la Imagen</label>
                        <input type="text" id="prod-imagen" class="form-control" placeholder="https://ejemplo.com/imagen.jpg">
                    </div>

                    <div class="form-actions">
                        <button type="submit" class="btn-submit">Guardar Producto</button>
                        <button type="button" class="btn-secondary" onclick="window.location.href='admin-productos.html'">Cancelar</button>
                    </div>
                </form>
            </div>
        </main>
    </div>

    <script src="js/app.js"></script>
</body>
</html>
