<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ferretería Los Maestros | Iniciar Sesión</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <script src="js/app.js"></script>
</head>
<body>
    <div id="header-container"></div>

    <main>
        <section class="form-container">
            <div>
                <h2>Iniciar Sesión</h2>
                <p>Ingresa tus credenciales para acceder a tu cuenta</p>
            </div>

            <form id="form-login" novalidate>
                <div class="form-group">
                    <label for="login-email">Correo Electrónico *</label>
                    <input type="email" id="login-email" class="form-control" placeholder="ejemplo@duoc.cl">
                    <span class="error-message" id="error-login-email">Debe ser @duoc.cl, @profesor.duoc.cl o @gmail.com</span>
                </div>

                <div class="form-group">
                    <label for="login-pass">Contraseña *</label>
                    <input type="password" id="login-pass" class="form-control" placeholder="••••••••">
                    <span class="error-message" id="error-login-pass">Entre 4 y 10 caracteres</span>
                </div>

                <button type="submit" class="btn-submit">Ingresar</button>
            </form>

            <div class="form-footer-link">
                <p>¿No tienes cuenta? <a href="registro.html">Regístrate aquí</a></p>            
            </div>
        </section>
    </main>

    <div id="footer-container"></div>
</body>
</html>
