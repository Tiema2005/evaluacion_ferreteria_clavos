<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ferretería Los Maestros | Registro de Usuario</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="js/app.js"></script>
</head>
<body>

    <div id="header-container"></div>

    <main>
        <section class="form-container" >
            <div>
                <h2>Crear una Cuenta</h2>
                <p>Regístrate para realizar compras y gestionar tus pedidos</p>
            </div>

            <form id="form-registro" novalidate>
                <div class="form-grid">
                    <div class="form-group">
                        <label for="reg-run">RUT (sin puntos y con guion) *</label>
                        <input type="text" id="reg-run" class="form-control" placeholder="12345678K" maxlength="9">
                        <span class="error-message" id="error-reg-run">RUN no válido</span>
                    </div>

                    <div class="form-group">
                        <label for="reg-nombre">Nombre Completo *</label>
                        <input type="text" id="reg-nombre" class="form-control" placeholder="Juan Pérez">
                        <span class="error-message" id="error-reg-nombre">El nombre es obligatorio</span>
                    </div>

                    <div class="form-group">
                        <label for="reg-email">Correo Electrónico *</label>
                        <input type="email" id="reg-email" class="form-control" placeholder="usuario@duoc.cl">
                        <span class="error-message" id="error-reg-email">Correo no permitido</span>
                    </div>

                    <div class="form-group">
                        <label for="reg-region">Región *</label>
                        <select id="reg-region" class="form-control">
                            <option value="">Seleccione una región</option>
                        </select>
                        <span class="error-message" id="error-reg-region">Seleccione una región</span>
                    </div>

                    <div class="form-group">
                        <label for="reg-comuna">Comuna *</label>
                        <select id="reg-comuna" class="form-control" disabled>
                            <option value="">Seleccione primero una región</option>
                        </select>
                        <span class="error-message" id="error-reg-comuna">Seleccione una comuna</span>
                    </div>

                    <div class="form-group">
                        <label for="reg-pass">Contraseña *</label>
                        <input type="password" id="reg-pass" class="form-control" placeholder="••••••••">
                        <span class="error-message" id="error-reg-pass">Entre 4 y 10 caracteres</span>
                    </div>
                </div>

                <button type="submit" class="btn-submit">Registrarse</button>
            </form>
            
            <div class="form-footer-link">
                <p>¿Ya tienes una cuenta? <a href="login.html">Inicia sesión aquí</a></p>
            </div>
        </section>
    </main>

    <div id="footer-container"></div>
</body>
</html>
