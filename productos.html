<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ferretería Los Maestros | Productos</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    
    <div id="header-container"></div>

    <main>
        <section class="seccion-home">
            <h2>Catálogo de Productos</h2>
            <p>Consulta stock y precios en tiempo real sin necesidad de llamar.</p>

            <div class="products-filter-bar">
                <input type="text" id="input-buscar" class="form-control filter-search" placeholder="🔍 Buscar por nombre o marca...">
                <select id="select-categoria" class="form-control filter-select">
                    <option value="">Todas las categorías</option>
                    <option value="Mat. Construcción">Mat. Construcción</option>
                    <option value="Pinturas">Pinturas</option>
                    <option value="Herramientas">Herramientas</option>
                    <option value="Gasfitería">Gasfitería</option>
                    <option value="Electricidad">Electricidad</option>
                    <option value="Tornillería">Tornillería</option>
                    <option value="Madera">Madera</option>
                </select>
            </div>

            <div class="grid-3-col" id="catalogo-productos">
            </div>
        </section>
    </main>

    <div id="footer-container"></div>

    <script src="js/app.js"></script>
</body>
</html>
