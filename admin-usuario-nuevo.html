<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nuevo Usuario | Admin Los Maestros</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="admin-layout">

    <aside class="admin-sidebar">
        <h2>Panel de Control</h2>
        <nav>
            <ul>
                <li><a href="admin-home.html">Inicio</a></li>
                <li><a href="admin-usuarios.html" style="font-weight: bold; background-color: rgba(255,255,255,0.2);">Gestión de Usuarios</a></li>
                <li><a href="admin-productos.html">Gestión de Productos</a></li>
                <li><a href="index.html" style="margin-top: 40px; color: #ffcccc;">Cerrar Sesión (Tienda)</a></li>
            </ul>
        </nav>
    </aside>

    <main class="admin-content">
        <h1 style="color: var(--primary-color); margin-bottom: 20px;">Crear Nuevo Usuario</h1>
        
        <div class="card" style="max-width: 800px;">
            <form id="form-admin-usuario">
                <div class="form-grid">
                    <div class="form-group">
                        <label>RUN *</label>
                        <input type="text" class="form-control" placeholder="Ej: 19011022K">
                    </div>
                    <div class="form-group">
                        <label>Nombre Completo *</label>
                        <input type="text" class="form-control" placeholder="Nombre y Apellido">
                    </div>
                    <div class="form-group">
                        <label>Correo Electrónico *</label>
                        <input type="email" class="form-control" placeholder="usuario@duoc.cl">
                    </div>
                    <div class="form-group">
                        <label>Tipo de Usuario (Rol) *</label>
                        <select class="form-control">
                            <option>Cliente / Contratista</option>
                            <option>Vendedor</option>
                            <option>Administrador</option>
                        </select>
                    </div>
                </div>

                <div style="display: flex; gap: 15px; margin-top: 20px;">
                    <button type="button" class="btn-submit" onclick="alert('Usuario guardado con éxito'); window.location.href='admin-usuarios.html';">Guardar Usuario</button>
                    <button type="button" class="btn-primary" style="background-color: #6c757d;" onclick="window.location.href='admin-usuarios.html'">Cancelar</button>
                </div>
            </form>
        </div>
    </main>

</body>
</html>
