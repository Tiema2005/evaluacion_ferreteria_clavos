<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ferretería Los Maestros | Contáctanos</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <div id="header-container"></div>

    <main>
        <div class="contact-header">
            <h1 class="contact-title">Contáctanos</h1>
            <p class="contact-subtitle">Estamos aquí para ayudarte. Ponte en contacto con nosotros.</p>
        </div>

        <section class="contact-layout-wrapper">
            
            <div class="card contact-info-card">
                <h3 class="contact-card-title">Información de Contacto</h3>
                
                <div class="contact-info-item">
                    <strong>📞 Teléfono</strong>
                    <p class="contact-info-text">(56-2) 2 499 8600</p>
                </div>

                <div class="contact-info-item">
                    <strong>✉ Email</strong>
                    <p class="contact-info-text">contacto@losmaestros.cl</p>
                </div>

                <div class="contact-info-item">
                    <strong>📍 Dirección</strong>
                    <p class="contact-info-text">Av. Calera de Tango 1553, San Bernardo</p>
                </div>
            </div>

            <div class="card contact-form-card">
                <h3 class="contact-card-title">Envíanos un Mensaje</h3>
                <form id="form-contacto" novalidate>
                    <div class="form-grid">
                        <div class="form-group">
                            <label>Nombre *</label>
                            <input type="text" id="contact-nombre" class="form-control" placeholder="Tu nombre completo">
                            <span class="error-message" id="error-contact-nombre">Obligatorio</span>
                        </div>
                        <div class="form-group">
                            <label>Email *</label>
                            <input type="email" id="contact-email" class="form-control" placeholder="tu@email.com">
                            <span class="error-message" id="error-contact-email">Correo inválido</span>
                        </div>
                    </div>

                    <div class="form-group">
                        <label>Mensaje *</label>
                        <textarea id="contact-mensaje" class="form-control" rows="5" placeholder="Escribe tu mensaje aquí..."></textarea>
                        <span class="error-message" id="error-contact-mensaje">No puede estar vacío</span>
                    </div>

                    <button type="submit" class="btn-submit">Enviar Mensaje</button>
                </form>
            </div>

        </section>
    </main>

    <div id="footer-container"></div>
    <script src="js/app.js"></script>
</body>
</html>
